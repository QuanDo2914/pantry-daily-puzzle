<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clearline final corrections</title><link rel="stylesheet" href="/clearline-preview/gallery.css"><link rel="stylesheet" href="/clearline-expansion/gallery.css"><style>.compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.compare-card{background:#fff;border:1px solid #dfe7dd;border-radius:18px;padding:20px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair figure{margin:0;text-align:center;background:#f5f8f3;border-radius:12px;padding:12px}.pair svg{width:100%;max-width:160px;height:auto}.pair figcaption{font-size:12px;color:#536b58;margin-top:5px}.compare-card h2{font-size:18px;margin:0 0 12px}@media(max-width:375px){.pair figure{padding:6px}}</style></head>
